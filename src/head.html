<title>MIRA Page Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one 1240px column for everything - title, abstract, section heads, charts, table, figures, case study.
   Paper white, JD red for actions and key numbers, wine red for emphasis, rose tints for highlights.
   Three looks share the tokens: paper (flat), glass (frosted cards over a soft red wash), editorial (deep red hero band). */
:root {
  --red: #DA291C;        /* JD red: buttons, key data */
  --red-press: #B8221A;
  --wine: #B02D3A;       /* emphasis text, lines, marks */
  --deep: #7A1420;       /* deepest red: hero band, dark marks */
  --rose: #FCDEE0;       /* soft highlight fill */
  --tint: #FFF2F3;       /* lightest tint */
  --hl: #EED6D7;         /* request-term highlighter */
  --bg: #FFFFFF;
  --bg-glass: #FBF7F7;   /* page ground under the glass look */
  --bg-2: #F7F3F3;       /* alternate surface */
  --fg: #1C1A1A;
  --muted: #6B6366;
  --line: rgba(176,45,58,.16);
  --line-soft: rgba(28,26,26,.08);
  --card: rgba(255,255,255,.78);
  --card-solid: #FFFFFF;
  --card-border: rgba(176,45,58,.12);
  --shadow: 0 18px 50px -24px rgba(122,20,32,.28), 0 1px 0 rgba(255,255,255,.6) inset;
  --wm: #B02D3A;         /* watermark ink */
  --wm-alpha: .055;
  --blur: 0px;
  --grey-1: #CFC7C9; --grey-2: #B3A9AC; --grey-3: #958A8D; --grey-4: #6F6468; --grey-5: #4A4245;
  --hero-fg: var(--fg); --hero-muted: var(--muted); --hero-bg: transparent;
  --font-display: "Inter Tight", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --page: color-mix(in srgb, var(--card-solid) 55%, var(--tint));   /* the case-study sheets */
  --veil: rgba(96, 32, 40, .56);                                     /* frosted grey-red mask over the pipeline figures */
  --ease: cubic-bezier(.2,.7,.2,1);
  --coach-bg: #B02D3A;                                              /* coach-mark bubble, both themes */
  --sheet-1: color-mix(in srgb, var(--page) 90%, var(--wine)); --sheet-2: color-mix(in srgb, var(--page) 80%, var(--wine));   /* the sheets under the case page */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141214; --bg-glass: #141214; --bg-2: #1C1819; --fg: #F1ECEC; --muted: #A8A0A2;
    --line: rgba(240,122,134,.22); --line-soft: rgba(241,236,236,.1);
    --card: rgba(34,28,30,.66); --card-solid: #1F1A1C; --card-border: rgba(240,122,134,.18);
    --shadow: 0 18px 50px -24px rgba(0,0,0,.7);
    --rose: #3A1D21; --tint: #2A1619; --hl: #4A232A; --wine: #F07A86; --deep: #5A0F16; --wm: #F07A86; --wm-alpha: .07;
    --grey-1: #4A4245; --grey-2: #5E5558; --grey-3: #786E71; --grey-4: #9B9194; --grey-5: #C4BABD;
    --hero-fg: var(--fg); --hero-muted: var(--muted);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141214; --bg-glass: #141214; --bg-2: #1C1819; --fg: #F1ECEC; --muted: #A8A0A2;
  --line: rgba(240,122,134,.22); --line-soft: rgba(241,236,236,.1);
  --card: rgba(34,28,30,.66); --card-solid: #1F1A1C; --card-border: rgba(240,122,134,.18);
  --shadow: 0 18px 50px -24px rgba(0,0,0,.7);
  --rose: #3A1D21; --tint: #2A1619; --hl: #4A232A; --wine: #F07A86; --deep: #5A0F16; --wm: #F07A86; --wm-alpha: .07;
  --grey-1: #4A4245; --grey-2: #5E5558; --grey-3: #786E71; --grey-4: #9B9194; --grey-5: #C4BABD;
  --hero-fg: var(--fg); --hero-muted: var(--muted);
  color-scheme: dark;
}
/* Looks */
body[data-look="glass"] { --blur: 20px; --wm-alpha: .065; background: var(--bg-glass); }
body[data-look="editorial"] { --hero-bg: linear-gradient(160deg, #7E1622 0%, #5A0D17 52%, #33050B 100%); --hero-fg: #FFF7F7; --hero-muted: rgba(255,247,247,.72); --blur: 20px; --wm-alpha: .065;
  background: linear-gradient(180deg, var(--tint) 0, var(--bg) 1200px) no-repeat, var(--bg); }
body[data-look="editorial"] .wash { opacity: .5; }

* { box-sizing: border-box; }
p, li, dd, .rd-note { text-wrap: pretty; }
h1, h2, h3, h4, h5, figcaption { text-wrap: balance; }
p, .hint, .caption, .steps .list span, .stage-foot span, .tbl-tools span { text-wrap: pretty; }   /* running text wraps at the right edge; only the last lines are tidied */
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
/* --k scales every length in this sheet (tools/build.py writes each Npx as calc(Npx * var(--k))): a desktop shows the page at 85%, the way a
   browser does at 85% zoom, so more of it fits on one screen; phones and tablets keep 1 */
:root { --k: 1; }
@media (min-width: 1100px) { :root { --k: .85; } html { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 1.05rem/1.6 var(--font-body);
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
/* soft red wash behind everything (glass look only) */
.wash { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .6s var(--ease);
  background:
    radial-gradient(60vw 50vh at 85% -5%, rgba(218,41,28,.13), transparent 70%),
    radial-gradient(45vw 40vh at -5% 70%, rgba(176,45,58,.10), transparent 70%),
    radial-gradient(35vw 30vh at 60% 110%, rgba(252,222,224,.6), transparent 70%); }
body[data-look="glass"] .wash { opacity: 1; }
.wrap, .wide { margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; }
.wide { max-width: 1240px; }
.prose { max-width: 880px; margin-inline: auto; }
img { max-width: 100%; height: auto; display: block; }
a { color: var(--wine); text-decoration-thickness: 1px; text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--font-mono); font-size: .9em; }
.num { font-variant-numeric: tabular-nums; }

/* cards */
.card { background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(1.2); backdrop-filter: blur(var(--blur)) saturate(1.2);
  transition: transform .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease); }
body[data-look="paper"] .card { box-shadow: none; border-color: var(--line-soft); background: var(--card-solid); }
.card.lift:hover { transform: translateY(-2px); border-color: var(--line); }

/* ---------- hero ---------- */
.hero { position: relative; overflow: clip; padding-block: clamp(44px, 7vh, 84px) 38px; text-align: center; background: var(--hero-bg); color: var(--hero-fg); }
.hero-in { position: relative; z-index: 1; }
/* as tall as the hero band and centred in it, so the whole dog always shows */
.wm { position: absolute; z-index: 0; right: 2vw; top: 0; bottom: 0; margin: auto 0; height: min(100%, 46vw); width: auto; aspect-ratio: 1; cursor: pointer; border: 0; padding: 0; background: transparent;
  opacity: var(--wm-alpha); transition: opacity .5s var(--ease); }
/* the mascot is five masked layers (the dog, three cards, the dotted links) so that each can move on its own; the pointer shifts each by its own depth (--z) */
.wm-l { position: absolute; inset: 0; display: block; translate: calc(var(--px, 0) * var(--z) * -1px) calc(var(--py, 0) * var(--z) * -1px); transition: translate .7s var(--ease); }
.wm-l.dog { --z: 10; transform-origin: 41% 59%; } .wm-l.dots { --z: 18; transform-origin: 63% 30%; }
.wm-l.c1 { --z: 42; transform-origin: 28% 21%; } .wm-l.c2 { --z: 34; transform-origin: 74% 22%; } .wm-l.c3 { --z: 26; transform-origin: 85% 50%; }
.wm-s { position: absolute; inset: 0; display: block; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat;
  background: linear-gradient(115deg, var(--wm) 0 42%, var(--red) 50%, var(--wm) 58% 100%); background-size: 320% 100%; background-position: 100% 0; transform-origin: 50% 90%; }
.wm-l.dog .wm-s { --m: url("assets/img/wm_dog.png"); }
.wm-l.c1 .wm-s { --m: url("assets/img/wm_card1.png"); }
.wm-l.c2 .wm-s { --m: url("assets/img/wm_card2.png"); }
.wm-l.c3 .wm-s { --m: url("assets/img/wm_card3.png"); }
.wm-l.dots .wm-s { --m: url("assets/img/wm_dots.png"); }
.wm:hover, .wm.near { opacity: calc(var(--wm-alpha) * 1.6); }
/* near the pointer, or during a trick, the three cards spring further away from the dog */
.wm-l.wc .wm-s { transition: transform .6s var(--ease); }
.wm.near .wm-l.wc .wm-s, .wm.wag .wm-l.wc .wm-s, .wm.flip .wm-l.wc .wm-s { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scale(1.05); }
.wm-l.c1 { --sx: -5%; --sy: -7%; --sr: -6deg; } .wm-l.c2 { --sx: 6%; --sy: -6%; --sr: 6deg; } .wm-l.c3 { --sx: 6%; --sy: 1.5%; --sr: 5deg; }
.wm.wag, .wm.flip { opacity: .3; }
.wm.wag .wm-s { animation: shine 1.2s linear 1; }
.wm.wag .dog .wm-s { animation: wag 1.2s var(--ease) 1, shine 1.2s linear 1; }
.wm.flip .wm-s { animation: shine 1.4s linear 1; }
.wm.flip .dog .wm-s { animation: flip 1.4s var(--ease) 1, shine 1.4s linear 1; }
body[data-look="editorial"] .wm { --wm: rgba(255,255,255,1); --wm-alpha: .12; }
body[data-look="editorial"] .wm-s { background: linear-gradient(115deg, rgba(255,255,255,1) 0 42%, #FFD2D6 50%, rgba(255,255,255,1) 58% 100%); background-size: 320% 100%; background-position: 100% 0; }
@keyframes wag { 0%{transform:rotate(0)} 18%{transform:rotate(-5deg) scale(1.03)} 40%{transform:rotate(4deg) scale(1.03)} 60%{transform:rotate(-2.5deg) scale(1.02)} 80%{transform:rotate(1.5deg)} 100%{transform:rotate(0)} }
@keyframes flip { from{transform:rotateY(0)} to{transform:rotateY(360deg)} }
@keyframes shine { from{background-position:100% 0} to{background-position:0% 0} }
/* first view: the cards slide in from the right and the links fade in; from then on everything drifts and breathes at its own pace */
@keyframes wm-in { from { transform: translate3d(90px, 0, 0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wm-fade { from { opacity: 0; } to { opacity: 1; } }
/* idle: the dog bobs, and each card floats out along its own line away from the dog and back (offsets are % of the mascot, so they scale with it) */
@keyframes wm-drift { from { transform: none; } to { transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--dr)); } }
@keyframes wm-breathe { from { opacity: 1; } to { opacity: var(--lo, .42); } }
.wm.enter .wm-l.wc { animation: wm-in .9s var(--ease) both; }
.wm.enter .wm-l.c3 { animation-delay: .2s; } .wm.enter .wm-l.c2 { animation-delay: .38s; } .wm.enter .wm-l.c1 { animation-delay: .56s; }
.wm.enter .wm-l.dots { animation: wm-fade .8s linear 1.1s both; }
.wm.idle .wm-l, .wm.idle .wm-l.wc, .wm.idle .wm-l.dots { animation: wm-drift var(--fd) ease-in-out var(--fo) infinite alternate, wm-breathe var(--bd) ease-in-out var(--bo) infinite alternate; }
.wm-l.dog { --dx: 0%; --dy: -2.8%; --dr: -1.5deg; --fd: 2.8s; --fo: -.6s; --bd: 7s; --bo: -2s; --lo: .72; }
.wm-l.dots { --dx: .8%; --dy: -1.8%; --dr: 0deg; --fd: 3.3s; --fo: -1.4s; --bd: 3s; --bo: 0s; }
.wm-l.c1 { --dx: -2.2%; --dy: -4.6%; --dr: -3deg; --fd: 3.2s; --fo: -1.1s; --bd: 5.6s; --bo: -2.5s; }
.wm-l.c2 { --dx: 3.4%; --dy: -3.8%; --dr: 3deg; --fd: 2.7s; --fo: -.4s; --bd: 4.9s; --bo: -1s; }
.wm-l.c3 { --dx: 4.6%; --dy: -1%; --dr: 2.5deg; --fd: 3.6s; --fo: -2s; --bd: 6.3s; --bo: -3.7s; }
.wm-hint.pulse { animation: hintpulse .9s var(--ease) 3; }
@keyframes hintpulse { 50% { transform: scale(1.14); opacity: 1; } }
.wm-hint { position: absolute; z-index: 1; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 14px; font-size: .78rem; color: var(--hero-muted); opacity: .8; }
@media (max-width: 760px) { .wm-hint { display: none; } .wm { right: -18vw; top: -2vh; bottom: auto; margin: 0; width: 70vw; height: auto; } .hero .affils span, .hero .notes { white-space: normal; } .hero .authors { font-size: 1rem; } }
.title { font: 700 clamp(1.8rem, 3.6vw, 3.25rem)/1.06 var(--font-display); letter-spacing: -.03em; margin: 0 auto 18px; }
.title .tl { display: inline-block; }   /* "MIRA: A Multimodal Illustrated" over "Deep Research Agent for Controllable Reports" */
@media (max-width: 760px) { .title { text-wrap: balance; } .title .tl { display: inline; } }   /* a phone balances the whole title instead */
.brand { color: var(--red); }
body[data-look="editorial"] .brand { color: #FFD2D6; }
.authors, .affils { margin: 6px auto; text-wrap: balance; line-height: 1.45; }
.authors span, .affils span { display: inline-block; white-space: nowrap; margin: 2px 10px; }
.authors .row, .affils .row { display: block; margin: 0; white-space: normal; }   /* five names, then three affiliations, per line */
.authors { font-size: 1.02rem; }
.affils, .notes { color: var(--hero-muted); font-size: .9rem; }
.notes { margin: 4px 0 0; font-size: .84rem; }
sup { font-size: .68em; }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px auto 0; padding: 8px; max-width: max-content; border-radius: 999px; }
body[data-look="glass"] .links { background: var(--card); border: 1px solid var(--card-border); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 20px; border-radius: 999px; background: var(--red); color: #fff; text-decoration: none; font-weight: 600; font-size: .95rem; border: 0; cursor: pointer;
  transition: transform .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease); }
.btn:hover { background: var(--red-press); transform: translateY(-1px); box-shadow: 0 10px 24px -12px rgba(218,41,28,.7); }
.btn small { font-weight: 500; opacity: .8; font-size: .78em; }
.btn .ic { width: 16px; height: 16px; display: inline-block; }
body[data-look="editorial"] .btn { background: #FFF7F7; color: var(--deep); }
body[data-look="editorial"] .btn:hover { background: #fff; }

/* ---------- top bar ---------- */
.topbar { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); z-index: 50; transform: translateY(-110%); transition: transform .4s var(--ease);
  background: color-mix(in srgb, var(--card-solid) 90%, transparent); border-bottom: 1px solid var(--card-border); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3); }
body[data-look="paper"] .topbar { background: var(--card-solid); }
.topbar.show { transform: translateY(0); }
.topbar-in { display: flex; align-items: center; gap: 18px; height: 54px; }
.topbar .logo { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; font: 700 1.05rem var(--font-display); letter-spacing: -.02em; color: var(--fg); text-decoration: none; }
.topbar .logo img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-soft); background: #fff; }
.topbar nav { flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; margin-left: 6px; overflow-x: auto; scrollbar-width: none; }
.secnav { position: fixed; left: max(22px, env(safe-area-inset-left, 0px)); top: 50%; transform: translate(-14px, -50%); z-index: 45; display: none; opacity: 0; pointer-events: none; transition: opacity .45s var(--ease), transform .45s var(--ease); }
.secnav.show { opacity: 1; pointer-events: auto; transform: translate(0, -50%); }
.secnav .rail-logo { display: block; width: 54px; height: 54px; margin: 0 0 20px; border-radius: 50%; overflow: hidden; background: #fff; border: 1px solid var(--line-soft); box-shadow: 0 12px 26px -14px rgba(122,20,32,.55); transition: transform .3s var(--ease); }
.secnav .rail-logo:hover { transform: scale(1.06); }
.secnav .rail-logo img { display: block; width: 100%; height: 100%; }
.secnav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 26px; }
.secnav .track, .secnav .fill { position: absolute; left: 7px; width: 2px; border-radius: 1px; background: var(--line); }
.secnav .fill { background: var(--red); transition: height .2s linear; }
.secnav a { display: flex; align-items: center; gap: 12px; color: var(--muted); text-decoration: none; font: 600 .8rem/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; transition: color .25s var(--ease); }
.secnav a i { position: relative; z-index: 1; flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; background: var(--bg); border: 2px solid var(--line); transition: all .25s var(--ease); }
.secnav a.done i { background: var(--red); border-color: var(--red); }
.secnav a.on i { border-color: var(--red); box-shadow: 0 0 0 5px var(--rose); }
.secnav a.on { color: var(--wine); } .secnav a:hover { color: var(--fg); }
.secnav .t { writing-mode: vertical-rl; }
/* the rail sits just left of the column (half the column, less its 16px padding, plus a 26px gap), not at the screen edge; on a narrow
   desktop it stops 10px from the edge, and the column keeps 80px each side clear for it */
@media (min-width: 1100px) { .secnav { display: flex; flex-direction: column; align-items: center; left: auto; right: min(calc(50% + min(620px, 50% - 80px) + 10px), calc(100% - 66px)); }   /* the logo centres on the dots-and-labels column */ .topbar nav { display: none; } .wrap { max-width: min(1240px, 100% - 160px); } .wide { max-width: min(1240px, 100% - 160px); } }
@media (max-width: 1500px) { table.results th, table.results td { padding: 9px 6px; } table.results thead th { font-size: .84rem; } }
@media (min-width: 1720px) { .secnav .t { writing-mode: horizontal-tb; } .secnav ol { gap: 22px; } }
.topbar nav::-webkit-scrollbar { display: none; }
.topbar nav a { padding: 6px 10px; border-radius: 999px; color: var(--muted); text-decoration: none; font-size: .88rem; white-space: nowrap; }
.topbar nav a:hover, .topbar nav a.on { color: var(--wine); background: var(--tint); }
.topbar .res { flex: 0 0 auto; margin-left: auto; display: flex; gap: 6px; }
.topbar .res a { padding: 5px 12px; border-radius: 999px; font-size: .82rem; font-weight: 600; color: #fff; background: var(--red); text-decoration: none; white-space: nowrap; }
@media (max-width: 760px) { .topbar .res a:not(.keep) { display: none; } .topbar-in { gap: 8px; } .topbar nav { margin-left: 0; -webkit-mask-image: linear-gradient(90deg, #000 82%, transparent); mask-image: linear-gradient(90deg, #000 82%, transparent); padding-right: 24px; } .topbar nav a { padding: 6px 8px; font-size: .84rem; } }

/* ---------- sections ---------- */
section.block { margin-top: clamp(56px, 8vw, 96px); }
.sec-head { margin: 0 auto 22px; text-align: center; }
.sec-head h2 { font: 600 clamp(1.35rem, 1.9vw, 1.72rem)/1.15 var(--font-display); margin: 0 0 10px; letter-spacing: -.025em; text-wrap: balance; }
.sec-head p { margin: 0 auto; color: var(--muted); opacity: .8; font-size: .92rem; }
.kicker { display: inline-block; font: 600 .74rem/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--wine); margin-bottom: 10px; }
.caption { color: var(--muted); font-size: .9rem; text-align: center; margin: 12px auto 0; max-width: 880px; }
.hint { color: var(--muted); font-size: .84rem; }

/* overview + highlights */
.overview { display: grid; grid-template-columns: 1fr; }
.overview .kicker { display: block; margin-bottom: 12px; }
.hl-col .kicker { margin: 6px 0 0; }
.hl-col .kicker small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); margin-left: 8px; }
.hl-col { display: grid; gap: 12px; }
.overview .lead { padding: 24px 32px 26px; font-size: 1.02rem; line-height: 1.62; }
.overview .lead p { columns: 2; column-gap: 44px; }
@media (max-width: 900px) { .overview .lead p { columns: 1; } }
.lead mark.key { background: linear-gradient(transparent 55%, var(--hl) 55%); color: inherit; padding: 0 2px; border-radius: 2px; }
.overview .lead p { margin: 0; text-align: left; }
.hl-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.hl-list li { padding: 16px 18px; border-radius: 14px; cursor: default; }
.hl-list b { display: block; font-family: var(--font-display); font-size: 1.08rem; font-weight: 600; letter-spacing: -.01em; margin-bottom: 2px; color: var(--wine); }
.hl-list li span { color: var(--muted); font-size: .94rem; }
.lead .sent { border-radius: 4px; transition: background .25s var(--ease); }
.lead .sent.lit { background: var(--hl); }
@media (max-width: 900px) { .overview { grid-template-columns: 1fr; } }

/* ---------- chart ---------- */
.chart-card { padding: 22px 22px 14px; }
.chart-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.legend button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line-soft); background: transparent; cursor: pointer; font-size: .84rem; color: var(--fg); transition: opacity .2s, border-color .2s; }
.legend button i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); display: inline-block; }
.legend button[aria-pressed="false"] { opacity: .4; }
.legend button:hover { border-color: var(--line); }
.chart-wrap { position: relative; overflow-x: auto; }
.chart-wrap svg { width: 100%; min-width: 720px; height: auto; display: block; font-family: var(--font-body); }
.chart-wrap .bar { transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .25s var(--ease), y .35s var(--ease), height .35s var(--ease), transform .8s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
.chart-wrap .val { transition: opacity .4s var(--ease); }
.chart-wrap.pre .bar { transform: scaleY(0); transition: none; } .chart-wrap.pre .val { opacity: 0; transition: none; }
.chart-wrap.staggering .bar, .chart-wrap.staggering .val { transition-delay: var(--d, 0s); }
table.results td.v.lit { background: var(--hl); box-shadow: inset 0 0 0 1.5px var(--red); }
.chart-wrap.hovering .bar:not(.hot) { opacity: .35; }
.chart-wrap .bench { cursor: pointer; fill: var(--muted); font-size: 13px; font-weight: 600; }
.chart-wrap .bench:hover { fill: var(--wine); }
.chart-wrap .grid { stroke: var(--line-soft); }
.chart-wrap .axis { stroke: var(--muted); }
.chart-wrap .val { fill: var(--fg); font-size: 11.5px; font-weight: 600; font-family: var(--font-mono); pointer-events: none; }
.tip { position: absolute; z-index: 5; pointer-events: none; opacity: 0; transform: translate(-50%, -8px); transition: opacity .15s;
  background: var(--card-solid); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: .82rem; line-height: 1.35; box-shadow: var(--shadow); max-width: 260px; white-space: nowrap; }
.tip.on { opacity: 1; }
.tip b { color: var(--wine); }
.tip .m { font-family: var(--font-mono); }

/* ---------- table ---------- */
.tbl-card { padding: 14px 10px 10px; overflow: visible; }
.tbl-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 4px 12px 10px; font-size: .86rem; color: var(--muted); }
.tbl-tools .pin { color: var(--wine); font-weight: 600; }
.tbl-tools button { border: 1px solid var(--line-soft); background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .82rem; }
table.results { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; table-layout: fixed; }
table.results col.c-model { width: 178px; }
table.results col.c-params { width: 94px; }

table.results th:first-child, table.results td:first-child { text-align: left; }

table.results thead th .sort { font-size: .7em; margin-left: 3px; opacity: .6; }
table.results tr.group td { background: transparent; color: var(--wine); font: 600 .76rem/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; padding: 18px 8px 6px; border-bottom: 0; }
table.results tr.sep td { border-top: 1px dashed var(--line); }
table.results td.model { font-weight: 500; cursor: pointer; }
table.results td.model:hover { color: var(--wine); }
table.results td.params { color: var(--muted); font-size: .84rem; font-family: var(--font-mono); }
table.results td.v { font-family: var(--font-mono); font-size: .92rem; }
table.results td.v .bar { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--grey-1); transform-origin: left; transform: scaleX(var(--w)); opacity: .9; }
table.results tr.ours td.v .bar { background: var(--red); }
table.results td.v.best { font-weight: 700; }
table.results td.v .d { display: block; font-size: .7rem; line-height: 1; margin-top: 3px; color: var(--muted); font-weight: 500; }
table.results td.v .d.up { color: var(--red); } table.results td.v .d.dn { color: var(--muted); }
table.results tr.ours td { background: var(--tint); }
table.results tr.ours td.model { color: var(--wine); font-weight: 600; }
table.results tr.pinned td.model::before { content: "◆"; color: var(--red); font-size: .6em; margin-right: 6px; vertical-align: middle; }
table.results td.hl-col, table.results th.hl-col { background: var(--rose); }
table.results tr.hl-row td { background: var(--rose); }
table.results td.flash { animation: flash 1.6s var(--ease) 1; }
@keyframes flash { 0%,40% { background: var(--rose); } 100% { background: transparent; } }
@media (max-width: 1200px) { table.results { font-size: .82rem; } table.results col.c-model { width: 190px; } table.results col.c-params { width: 96px; } table.results th, table.results td { padding: 8px 5px; } }
@media (max-width: 1099px) { #tableHost { overflow-x: auto; overscroll-behavior-x: contain; } }   /* below the rail breakpoint the fixed table can outgrow its card by a few pixels; let it scroll instead of the page */
@media (max-width: 960px) { table.results col.c-params { display: none; } table.results td.params, table.results th.params { display: none; } table.results col.c-model { width: 150px; } table.results td.model { white-space: normal; line-height: 1.25; } }
@media (max-width: 720px) {
  table.results, table.results tbody, table.results tr, table.results td { display: block; }
  table.results thead, table.results colgroup { display: none; }
  table.results tbody tr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; padding: 10px 8px 12px; border-bottom: 1px solid var(--line-soft); border-radius: 12px; }
  table.results tr.group { display: block; padding: 14px 8px 2px; }
  table.results tr.group td { padding: 0; }
  table.results td { border: 0; padding: 4px 2px; white-space: normal; }
  table.results td.model { grid-column: 1 / -1; font-size: 1rem; }
  table.results td.params { display: block; grid-column: 1 / -1; padding-top: 0; }
  table.results td.v { text-align: left; padding-left: 0; padding-bottom: 8px; }
  table.results td.v::before { content: attr(data-h); display: block; font: 500 .66rem/1.2 var(--font-body); color: var(--muted); letter-spacing: .04em; margin-bottom: 1px; }
  table.results td.v .bar { left: 0; right: 10px; }
  table.results tr.ours { background: var(--tint); }
  table.results tr.ours td { background: transparent; }
}

/* ---------- step figures ---------- */
.steps { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; padding: 18px; }
.steps .list { order: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px; margin: 0; padding: 0; list-style: none; }
.steps .list button { position: relative; width: 100%; text-align: left; padding: 11px 12px 11px 14px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; transition: background .2s, border-color .2s; }
.steps .list button:hover { background: var(--tint); }
.steps .list button[aria-pressed="true"] { background: var(--tint); border-color: var(--line); }
.steps .list.auto button[aria-pressed="true"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 4px; height: 2px; border-radius: 2px; background: var(--red); transform-origin: left; animation: step-tick var(--tick) linear both; }
@keyframes step-tick { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.steps .list .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 .78rem var(--font-mono); background: var(--rose); color: var(--wine); margin-top: 1px; }
.steps .list button[aria-pressed="true"] .n { background: var(--red); color: #fff; }
.steps .list b { display: block; font-weight: 600; font-size: .95rem; }
.steps .list span { display: block; color: var(--muted); font-size: .84rem; line-height: 1.4; margin-top: 2px; }
.steps .stage { position: relative; border-radius: 14px; overflow: hidden; background: #fff; cursor: zoom-in; border: 1px solid var(--line-soft); padding: clamp(10px, 1.6vw, 22px); }
.steps .stage img { display: block; width: 100%; }
.steps .spot { position: absolute; inset: 0; opacity: 0; background: var(--veil); -webkit-backdrop-filter: blur(3px) saturate(.6); backdrop-filter: blur(3px) saturate(.6); transition: opacity .35s var(--ease); pointer-events: none; }
.steps .lens { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px rgba(255,255,255,.55), 0 14px 34px -14px rgba(60,10,16,.5); pointer-events: none; transition: opacity .35s var(--ease); }
.steps .lens img { position: absolute; left: 0; top: 0; display: block; max-width: none; }   /* a second copy of the figure, rendered exactly like the first, clipped to the current block */
.steps .stage.on .spot, .steps .stage.on .lens { opacity: 1; }
.steps .stage.on .lens { transition: opacity .35s var(--ease), left .45s var(--ease), top .45s var(--ease), width .45s var(--ease), height .45s var(--ease); }
.steps .stage.on .lens img { transition: left .45s var(--ease), top .45s var(--ease), width .45s var(--ease), height .45s var(--ease); }
.steps .stage-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; font-size: .86rem; color: var(--muted); }
.steps .stage-foot button { border: 0; background: transparent; color: var(--wine); cursor: pointer; font-weight: 600; font-size: .84rem; padding: 2px 4px; }
@media (max-width: 560px) { .steps .list { grid-template-columns: 1fr; } }

/* ---------- case study: one run replayed, then a deck of report pages with tabs on the spine ---------- */
.replay { padding: 22px 26px 16px; margin-bottom: 30px; }
.replay-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 28px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
.replay-head .lead { flex: 1 1 520px; min-width: 0; }
.replay-head .lead .kicker { margin-bottom: 6px; }

.qtext { margin: 0; font: italic 400 clamp(1rem, 1.2vw, 1.12rem)/1.55 var(--font-serif); color: var(--fg); text-wrap: pretty; }
.runs { display: flex; flex-wrap: wrap; gap: 10px 12px; }
.run { display: inline-grid; grid-auto-flow: column; align-items: baseline; gap: 16px; padding: 10px 16px 10px 12px; border-radius: 12px; background: var(--card-solid); border: 1px solid var(--card-border); }
.run .mode { font: 700 .68rem/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: #fff; background: var(--wine); padding: 5px 8px; border-radius: 6px; }
.run .stat b { font: 600 1.25rem/1 var(--font-display); letter-spacing: -.02em; color: var(--fg); font-variant-numeric: tabular-nums; }
.run .stat small { margin-left: 5px; font: 500 .66rem/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.deck { position: relative; --sheet-dx: 22px; }
.deck .stack { position: relative; }
.deck .sheet { position: absolute; inset: 0; border-radius: 22px; background: var(--sheet-1); border: 1px solid var(--line); box-shadow: 0 12px 30px -18px rgba(122,20,32,.45); }
.deck .sheet.s1 { transform: translate(calc(-1 * var(--sheet-dx)), var(--sheet-dx)); z-index: 1; }
.deck .sheet.s2 { transform: translate(calc(-2 * var(--sheet-dx)), calc(2 * var(--sheet-dx))); z-index: 0; background: var(--sheet-2); }
.deck .page { position: relative; z-index: 2; background: var(--page); border: 1px solid var(--card-border); border-radius: 22px; padding: 28px clamp(16px, 2.4vw, 34px) 30px; box-shadow: 0 28px 70px -36px rgba(122,20,32,.42); transition: transform .42s var(--ease), opacity .3s var(--ease); }
body[data-look="paper"] .deck .page, body[data-look="paper"] .deck .sheet { box-shadow: none; }
.deck .page.out { transform: translate(36px, -20px) rotate(.6deg); opacity: 0; transition: transform .26s cubic-bezier(.4, 0, .8, .4), opacity .22s linear; }
.deck .page.in { transform: translate(calc(-2 * var(--sheet-dx)), calc(2 * var(--sheet-dx))) scale(.985); opacity: 0; transition: none; }
.deck .tabs { position: absolute; left: calc(100% - 4px); top: 34px; z-index: 1; display: grid; gap: 10px; }   /* tucked 4px under the page so the pulled-out tab leaves no gap */
.deck .tabs button { writing-mode: vertical-rl; display: inline-flex; align-items: center; gap: 12px; padding: 18px 11px 20px 10px; border-radius: 0 14px 14px 0; border: 1px solid var(--card-border); border-left: 0; background: var(--card-solid); color: var(--muted); font: 600 .95rem/1 var(--font-display); letter-spacing: .03em; white-space: nowrap; cursor: pointer; box-shadow: 10px 0 24px -16px rgba(122,20,32,.4); transition: background .25s, color .25s, transform .25s var(--ease); }
.deck .tabs button .no { font: 500 .76rem/1 var(--font-mono); letter-spacing: .08em; opacity: .75; }
.deck .tabs button:hover { color: var(--wine); background: var(--tint); transform: translateX(2px); }
.deck .tabs button[aria-selected="true"] { background: var(--red); border-color: var(--red); color: #fff; transform: translateX(3px); }
.deck .tabs button[aria-selected="true"] .no { opacity: .9; }
.case-head { display: grid; gap: 10px; padding: 2px 6px 0; }
.case-head .kicker { margin-bottom: 0; }
.case-head .case-title { margin: 0; font: 600 clamp(1.4rem, 2.2vw, 1.9rem)/1.18 var(--font-serif); letter-spacing: -.01em; color: var(--fg); }
.case-head .qtext { margin-top: 2px; font-size: clamp(1.02rem, 1.25vw, 1.16rem); }
.case-head .runs { margin-top: 10px; }
.toolbar { display: grid; gap: 12px; margin: 18px 0 14px; padding: 14px 6px 0; border-top: 1px solid var(--line-soft); }
.toolbar .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.toolbar .grow { flex: 1 1 10px; }
.modes { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line-soft); }
.modes button { border: 0; background: transparent; border-radius: 10px; padding: 8px 14px; cursor: pointer; text-align: left; color: var(--muted); display: grid; gap: 4px; }

.modes button small { font: 500 .72rem/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; }
.modes button[aria-selected="true"] { background: var(--card-solid); color: var(--fg); box-shadow: 0 4px 14px -8px rgba(122,20,32,.4); }
.modes button[aria-selected="true"] small { color: var(--wine); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line-soft); background: var(--card-solid); color: var(--muted); font-size: .86rem; font-weight: 500; cursor: pointer; user-select: none; transition: background .2s, color .2s, border-color .2s; }
.chips label:hover { border-color: var(--line); }
.chips label.on { color: var(--fg); background: var(--tint); border-color: var(--line); }
.chips input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.chips label:has(input:focus-visible) { outline: 2px solid var(--red); outline-offset: 2px; }   /* the hidden checkbox cannot show its ring; the pill does */
.chips .sw { width: 13px; height: 13px; border-radius: 3px; display: inline-block; opacity: .4; }
.chips label.on .sw { opacity: 1; }
.chips .cnt { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); }
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line-soft); background: var(--card-solid); font-size: .86rem; font-weight: 600; color: var(--wine); white-space: nowrap; user-select: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu > summary::after { content: "\25BE"; font-size: .8em; opacity: .8; }
.menu[open] > summary { background: var(--tint); border-color: var(--line); }
.menu .pop { position: absolute; z-index: 6; top: calc(100% + 8px); right: 0; width: max-content; min-width: 260px; max-width: min(460px, calc(100vw - 48px)); max-height: 380px; overflow: auto; padding: 10px 12px; border-radius: 14px; background: var(--card-solid); border: 1px solid var(--card-border); box-shadow: var(--shadow); }
.toc { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.toc a { display: flex; justify-content: space-between; gap: 14px; padding: 6px 9px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: .88rem; }
.toc a small { font-family: var(--font-mono); font-size: .72rem; opacity: .8; white-space: nowrap; }
.toc a:hover, .toc a.on { color: var(--wine); background: var(--tint); }
.gate-log { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: .84rem; line-height: 1.45; }
.gate-log li { padding: 8px 10px; border-radius: 10px; background: var(--bg-2); border-left: 3px solid var(--grey-2); }
.gate-log li.ok { border-left-color: var(--red); }
.gate-log b.gate-warn { color: var(--wine); } .gate-log b.gate-ok { color: var(--red); }

/* ---------- the book: a report on fixed-size pages, two per view on wide screens, turned by arrows, keys or a swipe ---------- */
.book { position: relative; --book-h: clamp(520px, calc(100vh - 240px), 760px); --book-gap: 48px; }
.book .leaves { padding: 26px 30px 28px; border-radius: 16px; background: var(--card-solid); border: 1px solid var(--card-border); box-shadow: var(--shadow); }
body[data-look="paper"] .book .leaves { box-shadow: none; }
.book .view { position: relative; height: var(--book-h); overflow: hidden; outline: 0; touch-action: pan-y; border-radius: 6px; }
.book .view:focus-visible { box-shadow: 0 0 0 3px var(--rose); }
.book .article { height: 100%; column-count: 2; column-gap: var(--book-gap); column-fill: auto; transform: translateX(calc(-1 * var(--pg, 0) * var(--pg-w, 0px))); transition: transform .5s var(--ease); }
.book .article.jump { transition: none; }
.book .rd-head { break-after: avoid; margin: 0; }
.book .rd-title { margin: 0 0 16px; }
.book .rd-sec h4 { break-after: avoid; }
.book .rd-fig, .book .rd-note, .book .rd-trace, .book .rd-reflist li, .book .rd-list li, .book .rd-imgsrc { break-inside: avoid; }
.book .rd-fig { margin: 10px 0 16px; text-align: center; }
.book .rd-fig figcaption, .book .rd-fig .rd-trace { text-align: left; }
.book .rd-imgwrap { display: inline-block; width: auto; max-width: 100%; vertical-align: top; }
.book .rd-imgwrap img { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(var(--book-h) - 270px); }
.book .rd-reflist { display: block; }
.book .rd-reflist li { margin: 0 0 8px; }
.book .turn { position: absolute; top: calc((var(--book-h) + 56px) / 2); transform: translateY(-50%); z-index: 4; width: 44px; height: 44px; padding: 0 0 3px; border-radius: 50%; border: 1px solid var(--card-border); background: var(--card-solid); color: var(--wine); font: 400 28px/1 var(--font-display); cursor: pointer; display: grid; place-items: center; box-shadow: 0 10px 24px -12px rgba(122,20,32,.55); transition: background .2s, color .2s, border-color .2s, opacity .2s; }
.book .turn.prev { left: -22px; } .book .turn.next { right: -22px; }
.book .turn:hover { background: var(--red); border-color: var(--red); color: #fff; }
.book .turn[disabled] { opacity: .3; pointer-events: none; }
.book-foot { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 16px; margin-top: 12px; min-height: 28px; font-size: .86rem; color: var(--muted); }
.book-foot .pageno { font-family: var(--font-mono); font-size: .84rem; color: var(--fg); white-space: nowrap; }
.book-foot .dots { display: flex; gap: 5px; align-items: center; }
.book-foot .dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 999px; background: var(--grey-1); cursor: pointer; transition: width .25s var(--ease), background .25s; }
.book-foot .dots button.on { width: 18px; background: var(--red); }
.book-foot .keys { display: none; }
@media (hover: hover) { .book-foot .keys { display: inline; } }
/* ---------- coach marks: once the toolbar is in view, a halo slides over each control with a one-line tip, so the reader learns what can be done; the Guide button replays it ---------- */
.case-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.guide { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 5px 13px 5px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-solid); color: var(--wine); font: 600 .84rem/1 var(--font-body); cursor: pointer; transition: background .2s, border-color .2s, color .2s; }
.guide .q { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--rose); font-weight: 700; font-size: .78rem; transition: background .2s, color .2s; }
.guide:hover { background: var(--red); border-color: var(--red); color: #fff; }
